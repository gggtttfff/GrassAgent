name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # 老 tag 早于本工作流存在，手动跑一次可以补发当前版本，不必重打 tag
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # 配好 Trusted Publisher 后走 OIDC，不再需要长期 token

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # secrets 不能直接写进 if，先落到 env；删掉 NPM_TOKEN secret 就自动切到 OIDC
      NPM_TOKEN_VALUE: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite 和 type stripping 都要 Node 24+；registry-url 会生成带 NODE_AUTH_TOKEN 的 .npmrc
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # token 首发不走 OIDC，只有 Trusted Publisher 那条路才对 npm 版本有要求
      - name: 确保 npm 支持 OIDC
        if: ${{ env.NPM_TOKEN_VALUE == '' }}
        run: |
          # 版本低于 11.5.1 时 npm publish 只会报误导性的 404，不提示版本问题
          current="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n 1)" != "11.5.1" ]; then
            npm install -g npm@^11
          fi
          npm --version

      - name: 校验版本
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $package_version 不一致"
              exit 1
            fi
          fi
          if npm view "grassagent@$package_version" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "::error::grassagent@$package_version 已发布过，npm 不允许覆盖同版本，请先提升版本号"
            exit 1
          fi
          echo "准备发布 grassagent@$package_version"

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与测试
        run: npm run test:all

      - name: 编译
        run: npm run build

      - name: 校验发布包内容
        run: |
          test -f dist/cli.js || { echo "::error::dist/cli.js 不存在"; exit 1; }
          head -n 1 dist/cli.js | grep -q '^#!' || { echo "::error::bin 入口缺少 shebang"; exit 1; }
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module -e "
            import fs from 'node:fs';
            const info = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pack.json', 'utf8'))[0];
            const paths = new Set(info.files.map(file => file.path));
            for (const required of ['dist/cli.js', 'src/cli.ts', '.env.example']) {
              if (!paths.has(required)) throw new Error('发布包缺少 ' + required);
            }
            console.log('发布包校验通过，共 ' + paths.size + ' 个文件');
          "

      # 首发时包还不存在，npm 不给不存在的包配 Trusted Publisher，只能用 token 发一次。
      # 配好 Trusted Publisher 后删掉 NPM_TOKEN secret，就自动走 OIDC，代码不用改。
      - name: 发布到 npm（OIDC）
        if: ${{ env.NPM_TOKEN_VALUE == '' }}
        # 绝不能设 NODE_AUTH_TOKEN，连空值都会让 npm 放弃 OIDC 交换
        run: npm publish --access public --registry=https://registry.npmjs.org

      - name: 发布到 npm（token，仅首次发布）
        if: ${{ env.NPM_TOKEN_VALUE != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # prepublishOnly 会再编译一次；dist/ 在 .gitignore 里，不能指望 checkout 带下来
          # 显式指定 registry，避免环境里的镜像配置把包发到别处
          npm publish --access public --registry=https://registry.npmjs.org

      - name: 确认版本已在 npm 可见
        run: |
          version="$(node -p "require('./package.json').version")"
          # 首次发布有约 5 分钟的异步处理窗口：CLI 会打印 + pkg@version，registry 却只有 0.0.0-stage 占位包。
          # 立刻查会误报失败，所以轮询到真正可安装为止；超时才判失败，别让工作流假成功。
          for attempt in $(seq 1 30); do
            if npm view "grassagent@$version" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
              echo "grassagent@$version 已可从 npm 安装（第 $attempt 次检查）"
              exit 0
            fi
            echo "尚未可见，20 秒后重试（$attempt/30）"
            if [ "$attempt" -lt 30 ]; then
              sleep 20
            fi
          done
          echo "::error::发布后 10 分钟内 grassagent@$version 仍不可见，请检查 npm 的 staged 队列和发布日志"
          exit 1
