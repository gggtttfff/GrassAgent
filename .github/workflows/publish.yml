name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # 老 tag 早于本工作流存在，手动跑一次可以补发当前版本，不必重打 tag
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publisher 走 OIDC 的必需权限,没有它换不到发布令牌

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 用 v7:它不再写 always-auth(已在 npm 11 移除),也不再往环境里塞
      # XXXX-XXXXX 占位符。没有占位符,setup-node 写的认证行展开后是字面量,
      # npm 认得出「没配真 token」,才会老老实实走 OIDC 交换。
      - uses: actions/setup-node@v7
        with:
          # node:sqlite 和 type stripping 都要 Node 24+
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # npm 11.5.1 起才有 OIDC 发布。版本低于它时 npm publish 只报误导性的
      # 404,不提示版本问题,所以在这里先升好。
      - name: 确保 npm 支持 OIDC
        run: |
          current="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n 1)" != "11.5.1" ]; then
            npm install -g npm@^11
          fi
          npm --version

      - name: 校验版本
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $package_version 不一致"
              exit 1
            fi
          fi
          if npm view "grassagent@$package_version" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "::error::grassagent@$package_version 已发布过，npm 不允许覆盖同版本，请先提升版本号"
            exit 1
          fi
          echo "准备发布 grassagent@$package_version"

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与测试
        run: npm run test:all

      - name: 编译
        run: npm run build

      - name: 校验发布包内容
        run: |
          test -f dist/cli.js || { echo "::error::dist/cli.js 不存在"; exit 1; }
          head -n 1 dist/cli.js | grep -q '^#!' || { echo "::error::bin 入口缺少 shebang"; exit 1; }
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module -e "
            import fs from 'node:fs';
            const info = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pack.json', 'utf8'))[0];
            const paths = new Set(info.files.map(file => file.path));
            for (const required of ['dist/cli.js', 'src/cli.ts', '.env.example']) {
              if (!paths.has(required)) throw new Error('发布包缺少 ' + required);
            }
            console.log('发布包校验通过，共 ' + paths.size + ' 个文件');
          "

      # 认证由 Trusted Publisher 负责:GitHub 签发短期 OIDC 令牌,npm 用它换发布令牌。
      # 这里绝不能设 NODE_AUTH_TOKEN——哪怕是空值,npm 也会当成「已配凭据」而跳过交换。
      # provenance 显式打开:官方说托管发布会自动带,但那依赖 npm 从令牌里推断,
      # 推断失败时只有 warn,包照样发出去却没有溯源证明。写明更可靠。
      - name: 发布到 npm
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org

      - name: 确认版本已在 npm 可见
        run: |
          version="$(node -p "require('./package.json').version")"
          # 首次发布有约 5 分钟的异步处理窗口：CLI 会打印 + pkg@version，registry 却只有 0.0.0-stage 占位包。
          # 立刻查会误报失败，所以轮询到真正可安装为止；超时才判失败，别让工作流假成功。
          for attempt in $(seq 1 30); do
            if npm view "grassagent@$version" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
              echo "grassagent@$version 已可从 npm 安装（第 $attempt 次检查）"
              exit 0
            fi
            echo "尚未可见，20 秒后重试（$attempt/30）"
            if [ "$attempt" -lt 30 ]; then
              sleep 20
            fi
          done
          echo "::error::发布后 10 分钟内 grassagent@$version 仍不可见，请检查 npm 的 staged 队列和发布日志"
          exit 1
